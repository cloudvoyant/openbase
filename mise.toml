# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
_.path = ["{{config_root}}/bin"]
GOWORK = "off"

[monorepo]
config_roots = ["libs/*", "e2e/components"]

[tools]
go = "1.25.14"
golangci-lint = "2.15.0"
pulumi = "3.200.0"

[tasks.install]
run = "go mod download all"

[tasks.build]
run = [
  "mise run '//libs/...:build'",
]

[tasks.test]
run = [
  "mise run '//libs/...:test'",
  "go test -c -o /dev/null ./e2e/components",
]

[tasks.e2e]
description = "Run E2E suite(s): mise run e2e [file_or_suite] [--no-cleanup | --keep | --offline]"
run = "sh scripts/e2e-run.sh"

[tasks."e2e:cleanup"]
description = "Destroy leftover/retained E2E stacks from e2e/outputs/components/*/run-manifest.json"
run = "sh scripts/e2e-cleanup.sh"

[tasks."e2e:components"]
description = "Run components E2E suite"
run = [
  "mise run '//e2e/components:e2e'",
]

[tasks."e2e:gcp"]
description = "Run live GCP Bucket and CloudRunService E2E suites"
run = [
  "mise run '//e2e/components:e2e:gcp'",
]

[tasks."e2e:neon"]
description = "Run live Neon Database E2E suite"
run = [
  "mise run '//e2e/components:e2e:neon'",
]

[tasks."e2e:kinde"]
description = "Run live Kinde OidcApp E2E suite"
run = [
  "mise run '//e2e/components:e2e:kinde'",
]

[tasks."e2e:vercel"]
description = "Run live Vercel BlobStore and WebApp E2E suites"
run = [
  "mise run '//e2e/components:e2e:vercel'",
]

[tasks."e2e:apps"]
description = "Run live full-stack Vercel+Neon+Kinde and GCP+Neon+Kinde app E2E suites"
run = [
  "mise run '//e2e/components:e2e:apps'",
]

[tasks."e2e:live"]
description = "Run all live cloud E2E suites across GCP, Neon, Kinde, Vercel, and Links"
run = [
  "mise run '//e2e/components:e2e:live'",
]

[tasks.generate]
description = "Generate bridged Pulumi Go bindings for Neon and Kinde"
run = "sh scripts/generate-bridged.sh"

[tasks."generate:check"]
description = "Verify generated bridged Pulumi Go bindings have no uncommitted drift"
run = "sh scripts/generate-bridged.sh --check"

[tasks.format]
run = "golangci-lint fmt"

[tasks."format:check"]
run = "golangci-lint fmt --diff"

[tasks.lint]
run = "golangci-lint run"

[tasks."lint:fix"]
run = "golangci-lint run --fix"

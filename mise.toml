# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
_.path = ["{{config_root}}/bin"]
GOWORK = "off"

[monorepo]
config_roots = ["apps/*", "libs/*"]

[tools]
go = "1.25.14"
golangci-lint = "2.15.0"

[tasks.install]
run = "go mod download all"

[tasks.build]
run = [
  "mise run '//apps/...:build'",
  "mise run '//libs/...:build'",
]

[tasks.test]
run = "go test ./..."

[tasks.format]
run = "golangci-lint fmt"

[tasks."format:check"]
run = "golangci-lint fmt --diff"

[tasks.lint]
run = "golangci-lint run"

[tasks."lint:fix"]
run = "golangci-lint run --fix"

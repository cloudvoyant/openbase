[env]
GOWORK = "off"

[tools]
go = "1.25.14"
golangci-lint = "2.15.0"
pulumi = "3.200.0"

[tasks."e2e"]
description = "Run E2E suite(s): mise run e2e [file_or_suite] [--no-cleanup | --keep | --offline]"
run = "sh ../../scripts/e2e-run.sh"

[tasks."e2e:cleanup"]
description = "Destroy leftover/retained E2E stacks from e2e/outputs/components/*/run-manifest.json"
run = "sh ../../scripts/e2e-cleanup.sh"

[tasks."e2e:offline"]
description = "Run offline standalone consumer fixture checks without cloud credentials"
run = "sh ../../scripts/e2e-run.sh --offline"

[tasks."e2e:gcp"]
description = "Run live GCP Bucket and CloudRunService E2E suites"
run = "sh ../../scripts/e2e-run.sh gcp"

[tasks."e2e:neon"]
description = "Run live Neon Database E2E suite"
run = "sh ../../scripts/e2e-run.sh neon"

[tasks."e2e:kinde"]
description = "Run live Kinde OidcApp E2E suite"
run = "sh ../../scripts/e2e-run.sh kinde"

[tasks."e2e:vercel"]
description = "Run live Vercel BlobStore and WebApp E2E suites"
run = "sh ../../scripts/e2e-run.sh vercel"

[tasks."e2e:apps"]
description = "Run live composite Vercel+Neon+Kinde and GCP+Neon+Kinde app E2E suites"
run = "sh ../../scripts/e2e-run.sh apps"

[tasks."e2e:live"]
description = "Run all live cloud E2E suites across GCP, Neon, Kinde, Vercel, Links, and composite apps"
run = "sh ../../scripts/e2e-run.sh"

[tasks."lint"]
run = "golangci-lint run"

[tasks."format"]
run = "golangci-lint fmt"

[tasks."format:check"]
run = "golangci-lint fmt --diff"

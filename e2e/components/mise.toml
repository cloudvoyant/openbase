[env]
GOWORK = "off"

[tools]
go = "1.25.14"
golangci-lint = "2.15.0"
pulumi = "3.200.0"

[tasks."e2e"]
description = "Run offline standalone consumer fixture checks"
run = "go test . -count=1 -v"

[tasks."e2e:gcp"]
description = "Run live GCP Bucket and CloudRunService E2E suites"
run = "go test . -run '^TestGCP' -count=1 -timeout 45m -v"

[tasks."e2e:gcp".env]
OPENBASE_TEST_GCP = "1"

[tasks."e2e:neon"]
description = "Run live Neon Database E2E suite"
run = "go test . -run '^TestNeon' -count=1 -timeout 45m -v"

[tasks."e2e:neon".env]
OPENBASE_TEST_NEON = "1"

[tasks."e2e:kinde"]
description = "Run live Kinde OidcApp E2E suite"
run = "go test . -run '^TestKinde' -count=1 -timeout 45m -v"

[tasks."e2e:kinde".env]
OPENBASE_TEST_KINDE = "1"

[tasks."e2e:vercel"]
description = "Run live Vercel BlobStore and WebApp E2E suites"
run = "go test . -run '^TestVercel' -count=1 -timeout 45m -v"

[tasks."e2e:vercel".env]
OPENBASE_TEST_VERCEL = "1"

[tasks."e2e:live"]
description = "Run all live cloud E2E suites across GCP, Neon, Kinde, Vercel, and Links"
run = "go test . -count=1 -timeout 60m -v"

[tasks."e2e:live".env]
OPENBASE_TEST_LIVE = "1"

[tasks."lint"]
run = "golangci-lint run"

[tasks."format"]
run = "golangci-lint fmt"

[tasks."format:check"]
run = "golangci-lint fmt --diff"
